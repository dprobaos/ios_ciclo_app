# ================================================================
#  codemagic.yaml — Build iOS do V|D SEM MAC LOCAL.
#  O Codemagic gera o projeto Xcode via XcodeGen (project.yml) e
#  builda → TestFlight. Você nunca precisa abrir o Xcode.
#
#  IMPORTANTE: conecte a pasta `ios_ciclo_app/` como raiz do repositório,
#  para que este codemagic.yaml fique na raiz.
#
#  ATENÇÃO: o iOS builda do Git REMOTO. Edição local só entra no build
#  depois de commit + push na branch de build (`main`).
#
#  PRÉ-REQUISITOS no Codemagic (uma vez):
#   - Repositório conectado (raiz = ios_ciclo_app/).
#   - Integração App Store Connect "NeuroVoice ASC" (a mesma dos outros apps).
#   - App criado no App Store Connect com bundle com.dprobaos.cicloadois.
#   - Grupo de variáveis "ios_signing" com CM_CERTIFICATE_PRIVATE_KEY.
#     O grupo de variáveis é POR APP no Codemagic: se der
#     "CM_CERTIFICATE_PRIVATE_KEY is not defined", crie o grupo neste app
#     reusando a mesma chave (bolao_ios_signing_key.pem).
# ================================================================
workflows:
  ios-ciclo:
    name: V|D iOS (TestFlight)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "NeuroVoice ASC"
    environment:
      groups:
        - ios_signing          # contém CM_CERTIFICATE_PRIVATE_KEY (secured)
      xcode: latest
      vars:
        XCODE_PROJECT: "CicloApp.xcodeproj"
        XCODE_SCHEME: "CicloApp"
        BUNDLE_ID: "com.dprobaos.cicloadois"
    scripts:
      - name: Gerar o projeto Xcode (XcodeGen)
        script: |
          brew install xcodegen 2>/dev/null || true
          # Build number incremental (evita "version already used" no upload)
          BN="${BUILD_NUMBER:-$(date +%s)}"
          echo "Build number: $BN"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BN\"/" project.yml || true
          xcodegen generate
      - name: Assinatura automática (App Store Connect)
        script: |
          set -e
          keychain initialize
          echo "===== FETCH APP ($BUNDLE_ID) ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CM_CERTIFICATE_PRIVATE_KEY \
            --create
          echo "===== ADD CERTIFICATES ====="
          keychain add-certificates
          echo "===== USE PROFILES ====="
          xcode-project use-profiles --verbose
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dprobaos@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Manda para o TestFlight já submetendo o Beta App Review, para os
        # testadores EXTERNOS não ficarem presos num build antigo.
        submit_to_testflight: true
        # A distribuição para TODOS os grupos externos é feita pelo
        # codemagic-runner (asc_distribute.mjs), que descobre os grupos pela
        # API — assim não é preciso repetir nomes de grupo aqui.
        #
        # ⚠️ NÃO use `expire_build_submitted_for_review: true` aqui: ele expira
        # o build recém-enviado, que então SAI dos grupos do TestFlight e os
        # testadores ficam NOT_INVITED. Aconteceu no build 3 (15/08/2026).
